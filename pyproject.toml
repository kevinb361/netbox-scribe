[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "netbox-scribe"
version = "0.1.0"
description = "Versioned, AI-ready infrastructure context from NetBox"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Kevin Blalock" }]
keywords = ["netbox", "infrastructure", "inventory", "ai", "rag", "gitops"]
dependencies = ["httpx>=0.28,<1", "jsonschema>=4.25,<5", "PyYAML>=6.0,<7"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/kevinb361/netbox-scribe"
Repository = "https://github.com/kevinb361/netbox-scribe"
Issues = "https://github.com/kevinb361/netbox-scribe/issues"

[project.scripts]
nbscribe = "netbox_scribe.cli:main"

[dependency-groups]
dev = [
  "black>=25.1",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-xdist>=3.6",
  "ruff>=0.11",
  "types-jsonschema>=4.25",
  "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/netbox_scribe"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-n auto -q"
testpaths = ["tests"]
